name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "site/**"
      - "docs/**"
      - "*.md"
      - ".beads/**"
      - ".github/workflows/pages.yml"
  pull_request:
    paths-ignore:
      - "site/**"
      - "docs/**"
      - "*.md"
      - ".beads/**"
      - ".github/workflows/pages.yml"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    # the app targets macOS 26 and its tests read the running release
    runs-on: macos-26
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Lint and test
        run: just check
      - name: Test Homebrew cask generation
        run: python3 tools/test_homebrew_cask.py

      - name: Bundle the app
        run: just package
        env:
          # CI has no certificate; releases sign with Developer ID
          DAISY_SIGN_IDENTITY: "-"
