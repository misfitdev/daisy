name: Pages

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "docs/**"
      - ".mise.toml"
      - ".github/workflows/pages.yml"
      - ".github/workflows/release.yml"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Published release tag (empty uses the latest stable release)"
        required: false
        type: string
  pull_request:
    paths:
      - "site/**"
      - "docs/**"
      - ".mise.toml"
      - "Cargo.toml"
      - ".github/workflows/pages.yml"
      - ".github/workflows/release.yml"

permissions: {}

concurrency:
  group: pages-${{ github.event_name == 'pull_request' && github.event.pull_request.number || 'production' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          install_args: node

      - name: Resolve published release version
        if: github.event_name != 'pull_request'
        working-directory: site
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          metadata="$RUNNER_TEMP/site-release.json"
          if [ -n "$RELEASE_TAG" ]; then
            gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json tagName,assets,isDraft,isPrerelease > "$metadata"
          else
            gh release view --repo "$GITHUB_REPOSITORY" --json tagName,assets,isDraft,isPrerelease > "$metadata"
          fi
          version="$(node scripts/release-version.mjs "$metadata" "$RELEASE_TAG")"
          echo "DAISY_VERSION=$version" >> "$GITHUB_ENV"
      - name: Test and build site
        working-directory: site
        run: |
          npm ci
          npm test
          npm run build

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
        if: github.event_name != 'pull_request'

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        if: github.event_name != 'pull_request'
        with:
          path: site/dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
