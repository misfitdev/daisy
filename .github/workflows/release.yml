name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-26
    permissions:
      contents: read
      # GitHub artifact attestation
      id-token: write
      attestations: write
    outputs:
      hashes: ${{ steps.hashes.outputs.hashes }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          cache: false
          install_args: rust just

      - name: Check the tag matches the version
        run: |
          version="$(awk -F'"' '/^version = / {print $2; exit}' Cargo.toml)"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match Cargo.toml version $version"
            exit 1
          fi

      - name: Lint and test
        run: just check

      - name: Import the Developer ID certificate
        env:
          DEVELOPER_ID_P12: ${{ secrets.DEVELOPER_ID_P12 }}
          DEVELOPER_ID_P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          password="$(uuidgen)"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          certificate="$RUNNER_TEMP/developer-id.p12"
          printf '%s' "$DEVELOPER_ID_P12" | base64 --decode > "$certificate"
          security import "$certificate" -k "$keychain" -P "$DEVELOPER_ID_P12_PASSWORD" -T /usr/bin/codesign
          rm -f "$certificate"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$password" "$keychain" > /dev/null
          # the runner may lack Apple's Developer ID intermediate; pinned so a
          # tampered download fails the release instead of being trusted
          intermediate="$RUNNER_TEMP/DeveloperIDG2CA.cer"
          curl -fsSL https://www.apple.com/certificateauthority/DeveloperIDG2CA.cer -o "$intermediate"
          echo "f16cd3c54c7f83cea4bf1a3e6a0819c8aaa8e4a1528fd144715f350643d2df3a  $intermediate" | shasum -a 256 -c -
          security import "$intermediate" -k "$keychain"
          # search the signing keychain first, and still find Apple's intermediates
          security list-keychains -d user -s "$keychain" login.keychain

      - name: Build, sign and notarize
        env:
          DAISY_SIGN_IDENTITY: Developer ID Application
          DEVELOPER_ID_PROFILE_BASE64: ${{ secrets.DEVELOPER_ID_PROFILE_BASE64 }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
          NOTARY_KEY: ${{ secrets.NOTARY_KEY }}
        run: |
          export NOTARY_KEY_PATH="$RUNNER_TEMP/notary.p8"
          printf '%s' "$NOTARY_KEY" > "$NOTARY_KEY_PATH"
          export DAISY_PROVISIONING_PROFILE="$RUNNER_TEMP/daisy.provisionprofile"
          printf '%s' "$DEVELOPER_ID_PROFILE_BASE64" | base64 --decode > "$DAISY_PROVISIONING_PROFILE"
          just package
          rm -f "$NOTARY_KEY_PATH"

      - name: Generate Homebrew cask
        run: |
          python3 tools/test_homebrew_cask.py
          version="${GITHUB_REF_NAME#v}"
          python3 tools/homebrew-cask.py "target/dist/Daisy-$version-macos-arm64.dmg" target/dist/daisy.rb

      - name: Hash the release files
        id: hashes
        working-directory: target/dist
        run: echo "hashes=$(shasum -a 256 -- *.zip *.dmg *-update.toml | base64 | tr -d '\n')" >> "$GITHUB_OUTPUT"

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            target/dist/*.zip
            target/dist/*.dmg
            target/dist/*-update.toml

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: target/dist/
          if-no-files-found: error

  provenance:
    needs: build
    permissions:
      actions: read
      id-token: write
      contents: write
    # SLSA Build Level 3: the generator runs as an isolated reusable workflow.
    # It verifies its own ref and must be pinned by tag, not by commit.
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@v2.1.0 # zizmor: ignore[unpinned-uses] SLSA requires this generator to be referenced by tag
    with:
      base64-subjects: ${{ needs.build.outputs.hashes }}
      upload-assets: false

  release:
    needs: [build, provenance]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # release notes are generated from the whole history
          fetch-depth: 0
          persist-credentials: false

      - uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          cache: false
          install_args: git-cliff

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.provenance.outputs.provenance-name }}
          path: dist

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          git cliff --latest --strip header > notes.md
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "Daisy $version" \
            --notes-file notes.md \
            --verify-tag

  site:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    steps:
      - name: Dispatch Pages on the default branch
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          gh workflow run pages.yml --repo "$GITHUB_REPOSITORY" --ref "$DEFAULT_BRANCH" -f "release_tag=$RELEASE_TAG"
