[package]
name = "daisy"
version = "0.9.0"
edition = "2024"
rust-version = "1.94"
description = "Share one keyboard, mouse and trackpad swipes between macOS systems"
license = "MIT OR Apache-2.0"
publish = false

[[test]]
name = "menu"
harness = false

[dependencies]
socket2 = "0.6.5"
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive", "env"] }
hmac = "0.13.0"
libc = "0.2.190"
plist = "1.10.1"
postcard = { version = "1.1.3", default-features = false, features = ["use-std"] }
rand_core = "0.10.1"
getrandom = { version = "0.4.3", features = ["sys_rng"] }
serde = { version = "1.0.229", features = ["derive"] }
sha2 = "0.11.0"
snow = "0.10.0"
spake2 = "0.4.0"
subtle = "2.6.1"
zstd = "0.14.1"
xattr = "1.6.1"
thiserror = "2.0.21"
toml = "1.1.8"
tokio = { version = "1.53.2", features = ["io-std", "io-util", "macros", "net", "signal", "rt-multi-thread", "sync", "time"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
backon = { version = "1.6.0", default-features = false, features = ["std", "tokio-sleep"] }
mdns-sd = { version = "0.21.5", default-features = false, features = ["async"] }
p256 = { version = "0.14.0", features = ["ecdsa"] }
semver = "1.0.28"
ureq = { version = "3.4.2", default-features = false, features = ["json", "rustls-no-provider", "_ring", "platform-verifier"] }
sigstore-verify = { version = "0.14.0", default-features = false }
serde_json = "1.0.151"
base64 = "0.23.1"
tempfile = "3.27.0"
zip = { version = "9.0.0", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = { version = "3.7.0", features = ["OSX_10_15"] }
security-framework-sys = "2.17.0"
core-foundation = "0.10.1"
block2 = "0.6.2"
objc2 = "0.6.5"
objc2-app-kit = "0.3.2"
objc2-foundation = "0.3.2"
objc2-local-authentication = "0.3.2"
objc2-service-management = "0.3.2"

[dev-dependencies]
tokio = { version = "1.53.2", features = ["test-util"] }
