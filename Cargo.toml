[package]
name = "daisy"
version = "0.4.0"
edition = "2024"
rust-version = "1.94"
description = "Share one keyboard, mouse and trackpad swipes between macOS systems"
license = "MIT OR Apache-2.0"
publish = false

[[test]]
name = "menu"
harness = false

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive", "env"] }
hmac = "0.12"
plist = "1.10"
postcard = { version = "1.1.3", default-features = false, features = ["use-std"] }
rand_core = { version = "0.6", features = ["getrandom"] }
serde = { version = "1.0.229", features = ["derive"] }
sha2 = "0.10"
snow = "0.10.0"
spake2 = "0.4"
subtle = "2.6"
thiserror = "2.0.21"
toml = "1.1.6"
tokio = { version = "1.53.1", features = ["io-std", "io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
backon = { version = "1.6.0", default-features = false, features = ["std", "tokio-sleep"] }
mdns-sd = { version = "0.21.4", default-features = false, features = ["async"] }
ed25519-dalek = { version = "2", features = ["rand_core", "zeroize"] }

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
objc2 = "0.6.4"
objc2-app-kit = "0.3.2"
objc2-foundation = "0.3.2"
objc2-local-authentication = "0.3"
objc2-service-management = "0.3.2"

[dev-dependencies]
tempfile = "3.27.0"
tokio = { version = "1.53.1", features = ["test-util"] }
